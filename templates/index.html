<!DOCTYPE html>
<html>
<head>
    <title>{{ _("Smart Shopping Assistant") }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<header>
    <backbutton class="backbutton" onclick=""></backbutton>
    <h1>{{ _("Smart Shopping Assistant") }}</h1>
    <settingsbutton class="settingsbutton"></settingsbutton>
</header>

<body>
<div class="container text-center mt-3">

    <button type="button" 
            class="btn btn-primary" 
            onclick="playAndGo(this)" 
            data-url="{{ url_for('scan') }}" 
            data-audio="Start scan.mp3">
        {{ _("Start Scan") }} 
        <img src="{{ url_for('static', filename='img/scan.svg') }}" alt="Icon">
    </button>

    <button type="button" 
            class="btn btn-primary" 
            onclick="playAndGo(this)" 
            data-url="{{ url_for('cart') }}" 
            data-audio="View cart.mp3">
        {{ _("View Cart") }} 
        <img src="{{ url_for('static', filename='img/empty_cart.svg') }}" alt="Icon">
    </button>
</div>

    <script src="{{ url_for('static', filename='tts.js') }}"></script>

    <script>
       function playAndGo(buttonElement) {
       // This looks at the button's data-url and data-audio attributes
        const targetUrl = buttonElement.getAttribute('data-url');
        const audioFileName = buttonElement.getAttribute('data-audio');
    
        const audioPath = "/static/tts_output/" + encodeURIComponent(audioFileName);
        const audio = new Audio(audioPath);

        let moved = false;

        const movePage = () => {
            if(!moved) {
                moved = true;
                window.location.href = targetUrl;
            }
        };

        // 1. Pre-load the audio
    audio.load();

    // 2. Play the audio
    audio.play().then(() => {
        console.log("Audio started successfully");
        
        // 3. Only move when the audio NATURALLY ends
        audio.onended = movePage;

    }).catch(e => {
        console.log("Audio blocked or failed:", e);
        movePage(); // Move anyway if it fails
    });

    // 4. Safety backup: If audio is very short or glitchy, 
    // wait at least 2 seconds before forcing the move.
    setTimeout(movePage, 2500); 
    }
    </script>

</body>
</html>
