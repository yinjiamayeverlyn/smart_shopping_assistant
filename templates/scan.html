<!DOCTYPE html>
<html>
<head>
    <title>Scan</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
            <meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<header>
    <backbutton class="backbutton" onclick="goBack()">&#8249;</backbutton>
           <script>
            // function goBack() {
            // $.post("/add_test_product", {quantity: 3}, function(){
            //  $("#productModal").modal('hide');
            // }) };   
            function goBack() {
              window.history.back();
            }
          </script>
    <h1>{{ _("Real-Time Scanning") }}</h1>
    <settingsbutton class="settingsbutton">
        <img src="{{ url_for('static', filename='img/language.svg') }}" alt="Language Icon" width="32" height="32">
    </settingsbutton>
</header>

<body>
<div class="container text-center mt-3">

    <img src="{{ url_for('video_feed') }}" id="video" width="640" height="480">

<!-- 
     <video id="video" autoplay playsinline width="640" height="480"></video>
     <canvas id="canvas" width="640" height="480"></canvas>
     <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script> -->

    <!-- View Cart Button -->
    <div>
        <a href="{{ url_for('cart') }}" class="btn btn-success" data-text="View cart">{{ _("View Cart") }} <img src="{{ url_for('static', filename='img/empty_cart.svg') }}" alt="Button Icon"> </a>
        <script src="{{ url_for('static', filename='tts.js') }}"></script>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Product Detected</h5>
            <button type="button" class="btn-close" id="closeModal"></button>
          </div>
          <div class="modal-body">
            <p id="modalPrice"></p>
            Quantity: <input type="number" id="modalQty" value="1" min="1">
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" id="addCart">{{ _("Add To Cart") }} <img src="{{ url_for('static', filename='img/add.svg') }}" alt="Button Icon"> </button>
          </div>
        </div>
      </div>
    </div>
</div>

<script>

$("#addCart").click(function(){
    let qty = parseInt($("#modalQty").val());
    $.post("/add_to_cart", {quantity: qty}, function(){
        $("#productModal").modal('hide');
    });
});


$("#closeModal").click(function(){
    $.post("/cancel_detected", {}, function(){
        $("#productModal").modal('hide');
    });
});
</script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
