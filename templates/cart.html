<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<header>
    <backbutton class="backbutton" onclick="goBack()">&#8249;</backbutton>
         <script>
             function goBack() {
               window.history.back();
             }
          </script>
    <h1>{{ _("Cart") }}</h1>
    <settingsbutton class="settingsbutton">
    </settingsbutton>
</header>

<body>
<div class="container mt-3" >

    {% if cart %}
        {% for item in cart %}
        <div class="cart-item">
            <div class="name">{{ item.name }}</div>
            <div class="details">
                RM{{ "%.2f"|format(item.price) }} × {{ item.quantity }} = RM{{ "%.2f"|format(item.price * item.quantity) }}
            </div>
        </div>
        {% endfor %}

        <div class="cart-total" id="cartTotalText" style="display: flex; align-items: center; justify-content: center; cursor: default;">
        Total: RM{{ "%.2f"|format(total) }}
    
        <img src="{{ url_for('static', filename='img/speaker.svg') }}" 
     class="speaker-icon" 
     id="speakerIcon"
     onclick="announceTotal()" 
     ontouchstart="this.classList.add('pressed')"
     ontouchend="this.classList.add('pressed'); setTimeout(() => this.classList.remove('pressed'), 100)"
     alt="Speaker Icon" 
     style="width: 35px; height: 35px; margin-left: 15px;">
        </div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 30px;">
        <form id="finishForm" method="post" action="{{ url_for('finish_cart') }}">
            <button type="button" 
            class="btn btn-primary" 
            onclick="playAndFinish(this)" 
            data-audio="Finish.mp3">{{ _("Finish") }} 
            <img src="{{ url_for('static', filename='img/finish.svg') }}" alt="Button Icon"></button>
        </form>

        <button type="button" 
            onclick="clearCart()" class="btn-clear" ontouchstart="this.style.opacity='0.5'" 
        ontouchend="this.style.opacity='1'">Clear Cart
        </button>

</div>

    {% else %}
        <p class="text-center">{{ _("Cart is empty.") }}</p>
        <div class="empty-cart-image-center">      
               <img src="{{ url_for('static', filename='img/empty_cart.svg') }}" width="640" height="480" alt="Button Icon">
        </div>

        
    {% endif %}
</div>

<script>
    function announceTotal() {
    const totalElement = document.getElementById('cartTotalText');

const speech = window.speechSynthesis;
    const audioCache = {};

    window.speakText = function (text) {
    if (!text) return;

    if (speech.speaking) {
        speech.cancel();
    }

    if (audioCache[text]) {
        audioCache[text].currentTime = 0;
        audioCache[text].play();
    } else {
        const utterance = new SpeechSynthesisUtterance(text);
        speech.speak(utterance);
    }
};


    if (totalElement) {


         let totalVal = totalElement.textContent.trim().replace('Total: RM', '');
         let speechText = "Your total is " + totalVal + " Ringgits";
         speakText(speechText);

            // fetch('/tts?text=' + encodeURIComponent(speechText))
            // .then(response => response.json())
            // .then(data => {
            //     const audio = new Audio("/static/tts_output/" + data.filename);
            //     audio.play().catch(err => {
            //         console.log("Browser blocked auto-play. User must click the speaker icon.");
            //     });
            // });
    
    } else {
        // Handle the "Empty Cart" sound
        const emptyAudio = new Audio("/static/tts_output/Your cart is empty.mp3");
        emptyAudio.play().catch(e => console.log("Empty audio blocked"));
    }
}

document.addEventListener('DOMContentLoaded', () => {
    // Try to play automatically (Hopeful Way)
    announceTotal();
});

function playAndFinish(buttonElement) {
    // 1. Path to the sound
    const audioPath = "/static/tts_output/" + buttonElement.getAttribute('data-audio');
    const audio = new Audio(audioPath);
    const form = document.getElementById('finishForm');

    let hasSubmitted = false;

    // Function to submit the form safely
    const submitForm = () => {
        if (!hasSubmitted) {
            hasSubmitted = true;
            form.submit();
        }
    };

    // 2. Play the sound
    audio.play().then(() => {
        // When audio ends naturally, submit
        audio.onended = submitForm;
    }).catch(e => {
        console.log("Audio play failed:", e);
        submitForm(); // Submit anyway if audio is blocked
    });

    // 3. Safety Backup: Submit after 1.5 seconds no matter what
    // This prevents the "stuck" feeling
    setTimeout(submitForm, 1500);
}

function clearCart() {
        if (confirm("Confirm want to clear all items?")) {
        fetch('/clear_cart', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // 1. Manually hide the items so you SEE it is empty
                // This keeps us on the SAME page so the audio is NOT blocked
                const container = document.querySelector('.container');
                container.innerHTML =`<p class="text-center">{{ _("Cart is empty.") }}</p>
        <div class="empty-cart-image-center">      
               <img src="{{ url_for('static', filename='img/empty_cart.svg') }}" width="640" height="480" alt="Button Icon">
        </div>`;

                // 2. Play the audio (The browser allows this because you clicked 'Confirm')
                let audio = new Audio("{{ url_for('static', filename='tts_output/Your cart is empty.mp3') }}");
                audio.play();

                // 3. Optional: Reload after 2 seconds just to sync with the server
                // setTimeout(() => {
                //     location.reload();
                // }, 3000);
            }
        });
    }
    }
</script>
</body>
</html>
